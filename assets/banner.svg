<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="TrueTaste — voice-first food discovery for Pakistan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#E54510"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#F5B301"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <!-- soft ring accents -->
  <circle cx="1010" cy="60" r="180" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="1120" cy="330" r="120" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="300" cy="380" r="150" fill="#FFFFFF" opacity="0.04"/>

  <!-- voice-wave motif -->
  <g fill="#FFFFFF">
    <rect x="800" y="120" width="18" height="40" rx="9" opacity="0.45"/>
    <rect x="832" y="164" width="18" height="72" rx="9" opacity="0.75"/>
    <rect x="864" y="100" width="18" height="200" rx="9"/>
    <rect x="896" y="136" width="18" height="128" rx="9" opacity="0.85"/>
    <rect x="928" y="120" width="18" height="40" rx="9" opacity="0.45"/>
  </g>

  <!-- gold coin accent -->
  <g>
    <circle cx="1028" cy="300" r="42" fill="url(#coin)"/>
    <circle cx="1028" cy="300" r="30" fill="none" stroke="#B8860B" stroke-width="3" opacity="0.5"/>
    <text x="1028" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#7A5200" text-anchor="middle">₨</text>
  </g>

  <!-- headline -->
  <text x="90" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1">TrueTaste</text>

  <text x="92" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#FFFFFF" opacity="0.92">
    Scan a QR · speak a review · earn DineCoins · redeem rewards
  </text>

  <text x="92" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" opacity="0.78">
    The voice-first food-discovery app for Lahore, Islamabad &amp; Karachi.
  </text>

  <!-- tech strip -->
  <g>
    <rect x="90" y="286" width="118" height="34" rx="17" fill="#FFFFFF" opacity="0.14"/>
    <rect x="220" y="286" width="132" height="34" rx="17" fill="#FFFFFF" opacity="0.14"/>
    <rect x="364" y="286" width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.14"/>
    <text x="150" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">React Native</text>
    <text x="287" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Express + Mongo</text>
    <text x="425" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Groq Voice AI</text>
  </g>
</svg>