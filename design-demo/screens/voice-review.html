<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .waveform-bar {
            animation: wave 1s ease-in-out infinite alternate;
        }
        @keyframes wave {
            0% { height: 8px; }
            100% { height: 40px; }
        }
        .waveform-bar:nth-child(1) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(2) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.5s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-base text-on-surface min-h-screen flex flex-col font-body-md">
<!-- TopAppBar (Suppressed per Nav Shell Rule - transactional/focused page, but keeping a simple back button header as it's a sub-page) -->
<header class="flex justify-between items-center px-container-margin h-16 w-full sticky top-0 z-50 bg-background-base">
<button class="text-on-surface hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-headline-md text-headline-md text-primary font-bold">TrueTaste</span>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap relative overflow-hidden">
<!-- Background AI Glow Effect -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-50">
<div class="w-64 h-64 bg-ai-glow rounded-full filter blur-[60px] pulse-ring"></div>
</div>
<div class="text-center z-10 max-w-md w-full mb-12">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-on-surface mb-stack-sm">
                Tell us about your experience
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                Speak naturally. AI will turn your feedback into a review.
            </p>
</div>
<!-- Voice Recorder Component -->
<div class="z-10 flex flex-col items-center w-full">
<!-- Waveform Graphic -->
<div class="flex items-center gap-1 h-16 mb-stack-lg">
<div class="w-2 bg-secondary rounded-full waveform-bar"></div>
<div class="w-2 bg-secondary rounded-full waveform-bar" style="height: 24px;"></div>
<div class="w-2 bg-secondary rounded-full waveform-bar" style="height: 32px;"></div>
<div class="w-2 bg-secondary rounded-full waveform-bar" style="height: 16px;"></div>
<div class="w-2 bg-secondary rounded-full waveform-bar"></div>
</div>
<!-- Microphone Button -->
<button class="relative w-32 h-32 rounded-full bg-white shadow-[0px_10px_30px_rgba(113,42,226,0.15)] flex items-center justify-center group transition-transform hover:scale-105 active:scale-95 border-2 border-secondary/20">
<div class="absolute inset-0 rounded-full bg-secondary opacity-10 pulse-ring"></div>
<span class="material-symbols-outlined text-secondary" data-icon="mic" style="font-size: 48px; font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Stop Button -->
<button class="mt-12 bg-white border border-outline-variant text-on-surface px-8 py-3 rounded-full font-label-md text-label-md shadow-[0px_4px_20px_rgba(0,0,0,0.04)] hover:bg-surface-container transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-error" data-icon="stop_circle" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
                Stop Recording
            </button>
</div>
</main>
<!-- BottomNavBar (Suppressed per Nav Shell Rule - this is a transactional sub-page focused entirely on recording a review. Adding Bottom Nav here would distract from the main action.) -->
<script>
        // Simple script to toggle recording state visual (for demonstration)
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.querySelector('.relative.w-32.h-32');
            const stopBtn = document.querySelector('button:last-child');
            const waveformBars = document.querySelectorAll('.waveform-bar');
            let isRecording = true;

            const toggleRecording = () => {
                isRecording = !isRecording;
                if(isRecording) {
                    micBtn.querySelector('.pulse-ring').style.display = 'block';
                    waveformBars.forEach(bar => bar.style.animationPlayState = 'running');
                    micBtn.classList.add('border-secondary/20');
                    micBtn.classList.remove('border-surface-variant');
                } else {
                    micBtn.querySelector('.pulse-ring').style.display = 'none';
                    waveformBars.forEach(bar => {
                        bar.style.animationPlayState = 'paused';
                        bar.style.height = '8px'; // Reset height visually
                    });
                    micBtn.classList.remove('border-secondary/20');
                    micBtn.classList.add('border-surface-variant');
                }
            };

            stopBtn.addEventListener('click', toggleRecording);
        });
    </script>
</body></html>
