<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-base text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center absolute inset-0" data-alt="A beautiful, soft-focus, high-key photograph of an elegant dining experience in a bright, modern restaurant. The table is set with refined, minimalist tableware. Warm, inviting natural light floods the scene, creating a sophisticated and appetizing atmosphere. The color palette features soft neutrals, bright whites, and subtle hints of warm earthy tones, perfectly complementing the TrueTaste brand aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDQlso2GX9Bz_-ayjlIxu-Emk37ciNBWvT1rasFNxkGgebLpkGpmnCrOqQQLQnyT8w5D4JQvTDlqx8AHq2a4KG_TaFWdycyLY21wjsHVyBCGLzXFA_vFWsKTOqrQePMGEgS2imCUXEqmos9L9zAQp6UbAJAhP58lZvmgrOJwGdMyat0ypek8D2ZRHp958LdPX1QD8wszQJcxCWVUvGrjxJt5CiqG0GqWVhvAO9Yl_pgW3xPGk66KNc')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-white/40 via-white/20 to-black/30"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-[400px] px-container-margin md:px-0">
<!-- Glassmorphism Card -->
<div class="glass-panel rounded-[24px] p-stack-lg flex flex-col gap-section-gap w-full">
<!-- Header -->
<div class="text-center flex flex-col gap-stack-sm items-center">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight">TrueTaste</h1>
<h2 class="font-headline-md text-headline-md text-on-surface mt-stack-sm">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your culinary journey.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">mail</span>
<input class="w-full h-[56px] pl-[48px] pr-4 rounded-xl bg-surface-container-low border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors outline-none" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">lock</span>
<input class="w-full h-[56px] pl-[48px] pr-4 rounded-xl bg-surface-container-low border border-surface-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors outline-none" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-[56px] bg-primary-container text-white font-label-md text-label-md rounded-xl mt-stack-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-caption text-caption text-on-surface-variant">or continue with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-stack-md w-full">
<button class="flex-1 h-[48px] rounded-xl border border-surface-variant bg-white flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-on-surface">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                    Google
                </button>
<button class="flex-1 h-[48px] rounded-xl border border-surface-variant bg-white flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors font-label-md text-label-md text-on-surface">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.6 9.8c-.1-3.1 2.5-4.6 2.6-4.7-1.4-2.1-3.6-2.4-4.4-2.4-1.9-.2-3.7 1.1-4.7 1.1-1 0-2.5-1.1-4.1-1-2.1 0-4 1.2-5.1 3.1-2.2 3.8-.6 9.4 1.5 12.5 1 1.5 2.2 3.2 3.9 3.1 1.6-.1 2.2-1.1 4.1-1.1 1.9 0 2.5 1.1 4.2 1.1 1.7 0 2.7-1.5 3.7-3.1 1.2-1.7 1.7-3.4 1.8-3.5-.1-.1-3.2-1.2-3.5-5.1zM11.9 5.3c.9-1.1 1.5-2.6 1.3-4.1-1.3.1-2.9.9-3.8 2-.8 1-1.5 2.5-1.3 4.1 1.5.1 3-.7 3.8-2z"></path></svg>
                    Apple
                </button>
</div>
<!-- Create Account Link -->
<div class="text-center mt-2">
<span class="font-body-md text-body-md text-on-surface-variant">New to TrueTaste?</span>
<a class="font-label-md text-label-md text-primary-container hover:text-primary ml-1 transition-colors" href="#">Create an Account</a>
</div>
</div>
</div>
</body></html>
