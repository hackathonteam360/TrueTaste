<style>

<!-- Interactive Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Star Rating Logic
            const starBtns = document.querySelectorAll('.star-btn');
            let currentRating = 0;

            starBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = parseInt(btn.dataset.value);
                    currentRating = value;
                    updateStars(value);
                });
            });

            function updateStars(value) {
                starBtns.forEach(btn => {
                    const starIcon = btn.querySelector('span');
                    const btnVal = parseInt(btn.dataset.value);
                    
                    // Reset animation class
                    starIcon.classList.remove('star-pop');
                    
                    if (btnVal <= value) {
                        starIcon.classList.remove('text-surface-variant');
                        starIcon.classList.add('text-warning');
                        // Trigger reflow to restart animation
                        void starIcon.offsetWidth;
                        starIcon.classList.add('star-pop');
                    } else {
                        starIcon.classList.remove('text-warning');
                        starIcon.classList.add('text-surface-variant');
                    }
                });
            }

            // Quick Tags Logic
            const tagBtns = document.querySelectorAll('.tag-btn');
            tagBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.classList.toggle('bg-primary-container');
                    this.classList.toggle('text-white');
                    this.classList.toggle('border-primary-container');
                    
                    this.classList.toggle('bg-surface');
                    this.classList.toggle('text-on-surface');
                    this.classList.toggle('border-outline-variant');
                });
            });
        });
    </script>
