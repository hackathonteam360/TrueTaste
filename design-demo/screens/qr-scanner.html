<style>body {
    font-family: "Manrope", sans-serif;
    background-color: #000;
    /* Dark background for camera feel */
    }
.scan-frame {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 24px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
    /* The dark semi-transparent overlay */
    z-index: 10
    }
.scan-frame::before, .scan-frame::after, .scan-frame > div::before, .scan-frame > div::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: #FF6B35;
    border-style: solid
    }
.scan-frame::before {
    top: 0;
    left: 0;
    border-width: 4px 0 0 4px;
    border-top-left-radius: 24px
    }
.scan-frame::after {
    top: 0;
    right: 0;
    border-width: 4px 4px 0 0;
    border-top-right-radius: 24px
    }
.scan-frame > div::before {
    bottom: 0;
    left: 0;
    border-width: 0 0 4px 4px;
    border-bottom-left-radius: 24px
    }
.scan-frame > div::after {
    bottom: 0;
    right: 0;
    border-width: 0 4px 4px 0;
    border-bottom-right-radius: 24px
    }
.laser {
    width: 100%;
    height: 2px;
    background-color: rgba(255, 107, 53, 0.8);
    position: absolute;
    top: 50%;
    left: 0;
    box-shadow: 0 0 8px #FF6B35;
    animation: scan 2s infinite linear alternate
    }
@keyframes scan {
    0% {
        top: 10%;
        opacity: 0;
        } 10% {
        opacity: 1;
        } 90% {
        opacity: 1;
        } 100% {
        top: 90%;
        opacity: 0;
        }
    }
/* Fake Camera Background */
